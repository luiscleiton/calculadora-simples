<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="./main.js" defer></script>
    <title>Calculadora Simples</title>
</head>
<body>
    <input id="numero1" type"text" placeholder="Digite um número:">
    <input id="numero2" type"text" placeholder="Digite outro número:">
    <button id="adicao">+</button>
    <button id="subtração">-</button>
    <button id="multiplicação">x</button>
    <button id="divisão">/</button>
    <hr>
    <div id="resultado"></div>
</body>
</html>
